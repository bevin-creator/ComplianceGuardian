# Application
quarkus.application.name=Compliance Guard
quarkus.application.version=2.0.0

# HTTP
quarkus.http.port=8080

# CORS Configuration - Allow frontend on localhost:3000
# quarkus.http.cors=true
# quarkus.http.cors.origins=http://localhost:3000
# quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
# quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
# quarkus.http.cors.exposed-headers=Content-Disposition
# quarkus.http.cors.access-control-max-age=86400
# quarkus.http.cors.access-control-allow-credentials=true

#cors fix
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:3000
%dev.quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
%dev.quarkus.http.cors.access-control-allow-credentials=true
%dev.quarkus.http.cors.access-control-max-age=86400S


# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.guard".level=DEBUG
quarkus.log.category."com.guard.filter".level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.log.console.color=true

# HTTP Access Logging
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=combined

# Secrets — loaded from environment variables (simulating Vault injection)
# Override by setting env vars before startup
compliance.ai.api-key=${COMPLIANCE_AI_API_KEY:MOCK}
compliance.ai.endpoint=${COMPLIANCE_AI_ENDPOINT:https://mock.ai.endpoint/v1/explain}
compliance.high-risk-countries=${COMPLIANCE_HIGH_RISK_COUNTRIES:IR,KP,SY,CU,SD,MM,LY,SO,YE,AF}

# Micrometer / Prometheus
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# SmallRye Health
quarkus.smallrye-health.root-path=/q/health

# Database Configuration - H2 for Development
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:complianceguard;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true

# Database Configuration - PostgreSQL for Production
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=complianceguard
%prod.quarkus.datasource.password=complianceguard123
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/complianceguard
%prod.quarkus.datasource.jdbc.max-size=16
%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.log.sql=false

# Hibernate ORM Configuration
quarkus.hibernate-orm.sql-load-script=no-file

# JWT Configuration - Disabled in Dev Mode
%dev.quarkus.smallrye-jwt.enabled=false
%dev.quarkus.security.auth.enabled-in-dev-mode=false

# JWT Configuration - Production
%prod.mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
%prod.mp.jwt.verify.issuer=https://complianceguard.ibm.com
%prod.smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
%prod.smallrye.jwt.new-token.issuer=https://complianceguard.ibm.com
%prod.smallrye.jwt.new-token.lifespan=3600

