# =========================
# APPLICATION
# =========================
quarkus.application.name=Compliance Guard
quarkus.application.version=2.0.0
quarkus.http.port=8080

# =========================
# CORS Configuration
# =========================
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin,access-control-request-method,access-control-request-headers
quarkus.http.cors.exposed-headers=content-type,authorization,x-total-count
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=86400

# =========================
# LOGGING
# =========================
quarkus.log.level=INFO
quarkus.log.category."com.guard".level=DEBUG
quarkus.http.access-log.enabled=true

# =========================
# DEV DATABASE (H2)
# =========================
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:complianceguard;DB_CLOSE_DELAY=-1

# =========================
# PROD DATABASE (POSTGRES)
# =========================
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=complianceguard
%prod.quarkus.datasource.password=complianceguard123
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/complianceguard

# =========================
# HIBERNATE
# =========================
quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
# Enable import.sql in dev mode for seed data
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%prod.quarkus.hibernate-orm.sql-load-script=no-file

# =========================
# SECURITY DEV MODE
# =========================
%dev.quarkus.smallrye-jwt.enabled=false
%dev.quarkus.security.auth.enabled-in-dev-mode=false
# quarkus.security.enabled=false

# =========================
# JWT PROD ONLY
# =========================
%prod.mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
%prod.mp.jwt.verify.issuer=https://complianceguard.ibm.com
%prod.smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
%prod.smallrye.jwt.new-token.issuer=https://complianceguard.ibm.com
%prod.smallrye.jwt.new-token.lifespan=3600

