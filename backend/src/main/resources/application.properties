# Application
quarkus.application.name=Compliance Guard
quarkus.application.version=2.0.0

# HTTP
quarkus.http.port=8080

# CORS Configuration - Allow frontend on localhost:3000
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.guardian".level=DEBUG

# Secrets — loaded from environment variables (simulating Vault injection)
# Override by setting env vars before startup
compliance.ai.api-key=${COMPLIANCE_AI_API_KEY:MOCK}
compliance.ai.endpoint=${COMPLIANCE_AI_ENDPOINT:https://mock.ai.endpoint/v1/explain}
compliance.high-risk-countries=${COMPLIANCE_HIGH_RISK_COUNTRIES:IR,KP,SY,CU,SD,MM,LY,SO,YE,AF}

# Micrometer / Prometheus
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# SmallRye Health
quarkus.smallrye-health.root-path=/q/health

# Database Configuration - PostgreSQL (Production)
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=complianceguard
%prod.quarkus.datasource.password=complianceguard123
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/complianceguard
%prod.quarkus.datasource.jdbc.max-size=16

# Database Configuration - H2 (Development/Testing)
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:complianceguard;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.jdbc.max-size=8

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# JWT Configuration (Production only)
%prod.mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
%prod.mp.jwt.verify.issuer=https://complianceguard.ibm.com
%prod.smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
%prod.smallrye.jwt.new-token.issuer=https://complianceguard.ibm.com
%prod.smallrye.jwt.new-token.lifespan=3600

# Development mode - Disable security for testing
%dev.quarkus.security.auth.enabled-in-dev-mode=false
%dev.quarkus.http.auth.permission.permit-all.paths=/*
%dev.quarkus.http.auth.permission.permit-all.policy=permit

