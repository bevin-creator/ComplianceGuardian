# Application
quarkus.application.name=Compliance Guard
quarkus.application.version=2.0.0

# HTTP
quarkus.http.port=8081

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.guardian".level=DEBUG
quarkus.log.category."com.guard".level=DEBUG

# Database - PostgreSQL (Development)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:complianceguard}
quarkus.datasource.password=${DB_PASSWORD:complianceguard}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/complianceguard}
quarkus.datasource.jdbc.max-size=16

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=import.sql

# JWT Configuration
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=compliance-guard
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# Secrets — loaded from environment variables (simulating Vault injection)
# Override by setting env vars before startup
compliance.ai.api-key=${COMPLIANCE_AI_API_KEY:MOCK}
compliance.ai.endpoint=${COMPLIANCE_AI_ENDPOINT:https://mock.ai.endpoint/v1/explain}
compliance.high-risk-countries=${COMPLIANCE_HIGH_RISK_COUNTRIES:IR,KP,SY,CU,SD,MM,LY,SO,YE,AF}

# Micrometer / Prometheus
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# SmallRye Health
quarkus.smallrye-health.root-path=/q/health

