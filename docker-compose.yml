services:
  postgres:
    image: postgres:15-alpine
    container_name: complianceguard-db
    environment:
      POSTGRES_DB: complianceguard
      POSTGRES_USER: complianceguard
      POSTGRES_PASSWORD: complianceguard123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complianceguard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

