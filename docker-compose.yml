version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: compliance-guard-db
    environment:
      POSTGRES_DB: compliancedb
      POSTGRES_USER: complianceuser
      POSTGRES_PASSWORD: compliancepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complianceuser -d compliancedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compliance-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compliance-guard-backend
    environment:
      # Database Configuration
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/compliancedb
      QUARKUS_DATASOURCE_USERNAME: complianceuser
      QUARKUS_DATASOURCE_PASSWORD: compliancepass
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      
      # Hibernate Configuration
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
      QUARKUS_HIBERNATE_ORM_LOG_SQL: false
      
      # HTTP Configuration
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_CORS: true
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:3000,http://frontend:80
      
      # JWT Configuration
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: /app/publicKey.pem
      SMALLRYE_JWT_SIGN_KEY_LOCATION: /app/privateKey.pem
      
      # Application Configuration
      QUARKUS_LOG_LEVEL: INFO
      QUARKUS_LOG_CONSOLE_JSON: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - compliance-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compliance-guard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - compliance-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  compliance-network:
    driver: bridge

