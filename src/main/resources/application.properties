# Application
quarkus.application.name=compliance-guard
quarkus.application.version=2.0.0

# HTTP
quarkus.http.port=8081

# CORS Configuration for Frontend
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# Logging with trace correlation
quarkus.log.level=INFO
quarkus.log.category."com.guard".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] [traceId=%X{traceId} spanId=%X{spanId}] %s%e%n

# ========================================
# IBM Instana / OpenTelemetry Configuration
# ========================================
quarkus.opentelemetry.enabled=true
quarkus.opentelemetry.tracer.exporter.otlp.endpoint=https://ingress-blue-saas.instana.io:443/traces
quarkus.opentelemetry.tracer.sampler=always_on
quarkus.opentelemetry.propagators=tracecontext,baggage
quarkus.opentelemetry.tracer.resource-attributes=service.name=compliance-guard,service.instance.id=${HOSTNAME:local},instana.agent.key=nUMoydJTSF2BSbwtIL4iQw

# Environment-specific endpoints
%dev.quarkus.opentelemetry.tracer.exporter.otlp.endpoint=https://ingress-blue-saas.instana.io:443/traces
%prod.quarkus.opentelemetry.tracer.exporter.otlp.endpoint=${INSTANA_AGENT_ENDPOINT:https://ingress-blue-saas.instana.io:443/traces}

# OpenTelemetry logging
quarkus.log.category."io.opentelemetry".level=INFO

# ========================================
# IBM watsonx Orchestrate Configuration
# ========================================
orchestrate/mp-rest/url=https://api.au-syd.watson-orchestrate.cloud.ibm.com/instances/3b166c41-87bb-4af3-af7d-6f04eadb798b
orchestrate/mp-rest/connect-timeout=5000
orchestrate/mp-rest/read-timeout=15000
orchestrate/mp-rest/scope=jakarta.inject.Singleton

# Dev only - trust all certificates
%dev.orchestrate/mp-rest/trust-all=true

# ========================================
# Secrets Configuration
# ========================================
compliance.ai.api-key=${COMPLIANCE_AI_API_KEY:MOCK}
compliance.ai.endpoint=${COMPLIANCE_AI_ENDPOINT:https://mock.ai.endpoint/v1/explain}
compliance.high-risk-countries=${COMPLIANCE_HIGH_RISK_COUNTRIES:IR,KP,SY,CU,SD,MM,LY,SO,YE,AF}
compliance.orchestrate.api-key=eSPUgXDmVjpwb0-DSbMJmKPgJYfPslisn5aQ3TsEtTz4

# ========================================
# Micrometer / Prometheus
# ========================================
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ========================================
# SmallRye Health
# ========================================
quarkus.smallrye-health.root-path=/q/health

